<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>英文26字母大字練習</title>
  <style>
    :root {
      --bg-color: #f4f9f9;
      --card-bg: #ffffff;
      --primary: #2e86de;
      --primary-dark: #1b4f72;
      --secondary: #20bf6b;
      --text-main: #2c3e50;
      --accent: #f7b731;
      --border-color: #dcdde1;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: var(--bg-color); color: var(--text-main);
      display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    }
    header {
      background-color: var(--primary); color: white;
      padding: 12px 16px; text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15); flex-shrink: 0;
    }
    header h1 { margin: 0; font-size: 26px; font-weight: bold; }
    nav { display: flex; background: #dcdde1; border-bottom: 2px solid var(--border-color); flex-shrink: 0; }
    .tab-btn {
      flex: 1; padding: 14px 8px; font-size: 20px; font-weight: bold;
      border: none; background: transparent; color: #555; cursor: pointer; text-align: center;
    }
    .tab-btn.active { background: var(--card-bg); color: var(--primary-dark); border-bottom: 4px solid var(--primary); }
    main { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; align-items: center; }
    .page { display: none; width: 100%; max-width: 650px; flex-direction: column; align-items: center; }
    .page.active { display: flex; }
    .row-selector { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 16px; width: 100%; }
    .row-btn {
      padding: 8px 14px; font-size: 16px; font-weight: bold;
      border: 2px solid var(--primary); background: white; color: var(--primary);
      border-radius: 20px; cursor: pointer;
    }
    .card-container {
      background: var(--card-bg); border: 3px solid var(--border-color);
      border-radius: 24px; width: 100%; padding: 20px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08); text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .letter-display { font-size: 100px; font-weight: bold; color: var(--primary-dark); line-height: 1; }
    .phonetic-box {
      background: #eef5fc; border-radius: 12px; padding: 8px 20px;
      font-size: 24px; font-weight: bold; color: #20bf6b; width: 100%;
    }
    .word-card {
      background: #fef9e7; border: 2px dashed var(--accent);
      border-radius: 16px; padding: 12px 20px; width: 100%;
      cursor: pointer; display: flex; align-items: center; justify-content: space-around;
    }
    .word-icon { font-size: 40px; }
    .word-text { font-size: 28px; font-weight: bold; color: #e67e22; }
    .word-meaning { font-size: 22px; color: #555; }
    .speaker-btn {
      background: var(--primary); color: white; border: none;
      padding: 14px 32px; font-size: 24px; font-weight: bold;
      border-radius: 40px; cursor: pointer; margin-top: 10px;
      box-shadow: 0 4px 10px rgba(46, 134, 222, 0.4);
    }
    .nav-actions { display: flex; justify-content: space-between; width: 100%; margin-top: 16px; gap: 16px; }
    .action-btn {
      flex: 1; padding: 16px; font-size: 22px; font-weight: bold;
      background: var(--secondary); color: white; border: none;
      border-radius: 16px; cursor: pointer; text-align: center;
    }
    canvas { background: white; border: 3px solid var(--border-color); border-radius: 16px; touch-action: none; margin-top: 10px; }
    .canvas-tools { display: flex; gap: 12px; margin-top: 12px; width: 100%; }
    .tool-btn { flex: 1; padding: 12px; font-size: 18px; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; background: #e0e0e0; }
    .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; margin-top: 20px; }
    .quiz-btn {
      background: white; border: 3px solid var(--border-color);
      border-radius: 20px; padding: 24px; font-size: 48px; font-weight: bold;
      color: var(--text-main); cursor: pointer; text-align: center;
    }
  </style>
</head>
<body>

  <header><h1>英文 26 字母大字練習</h1></header>
  
  <nav>
    <button class="tab-btn active" onclick="switchTab('flashcard')">大字閃卡</button>
    <button class="tab-btn" onclick="switchTab('writing')">手指描寫</button>
    <button class="tab-btn" onclick="switchTab('quiz')">聽音選字</button>
  </nav>

  <main>
    <section id="flashcard" class="page active">
      <div class="row-selector">
        <button class="row-btn" onclick="jumpToIndex(0)">A - G</button>
        <button class="row-btn" onclick="jumpToIndex(7)">H - N</button>
        <button class="row-btn" onclick="jumpToIndex(14)">O - T</button>
        <button class="row-btn" onclick="jumpToIndex(20)">U - Z</button>
      </div>
      <div class="card-container">
        <div class="letter-display" id="letterDisplay">A a</div>
        <div id="phonetic" class="phonetic-box">發音諧音: 「ㄟ」</div>
        <div class="word-card" onclick="speakCurrentWord()">
          <span id="wordIcon" class="word-icon">🍎</span>
          <span id="wordText" class="word-text">Apple</span>
          <span id="wordMeaning" class="word-meaning">(蘋果) 🔊 點擊發音</span>
        </div>
        <button class="speaker-btn" onclick="speakCurrentLetter()">🔊 聽字母發音</button>
      </div>
      <div class="nav-actions">
        <button class="action-btn" onclick="prevLetter()">⬅️ 上一個</button>
        <button class="action-btn" onclick="nextLetter()">下一個 ➡️</button>
      </div>
    </section>

    <section id="writing" class="page">
      <h2 style="margin: 0; font-size: 24px;">手指跟著描描看</h2>
      <canvas id="writeCanvas" width="320" height="320"></canvas>
      <div class="canvas-tools">
        <button class="tool-btn" onclick="clearCanvas()">🗑️ 重寫</button>
        <button class="tool-btn" onclick="speakCurrentLetter()" style="background: var(--primary); color: white;">🔊 再聽一次</button>
      </div>
      <div class="nav-actions">
        <button class="action-btn" onclick="prevLetter()">⬅️ 上一個</button>
        <button class="action-btn" onclick="nextLetter()">下一個 ➡️</button>
      </div>
    </section>

    <section id="quiz" class="page">
      <h2 style="font-size: 24px; text-align: center;">聽聲音，選出正確的字母</h2>
      <button class="speaker-btn" onclick="playQuizSound()" style="margin-bottom: 20px;">🔊 播放聲音</button>
      <div class="quiz-options" id="quizOptions"></div>
      <div id="quizFeedback" style="font-size: 28px; font-weight: bold; margin-top: 20px; height: 36px;"></div>
    </section>
  </main>

  <script>
    const alphabetData = [
      { upper: 'A', lower: 'a', tw: 'ㄟ / 挨', word: 'Apple', icon: '🍎', meaning: '蘋果' },
      { upper: 'B', lower: 'b', tw: '逼 / 嗶', word: 'Boy', icon: '👦', meaning: '男孩' },
      { upper: 'C', lower: 'c', tw: '西 / 吸', word: 'Cat', icon: '🐱', meaning: '貓咪' },
      { upper: 'D', lower: 'd', tw: '低 / 豬', word: 'Dog', icon: '🐶', meaning: '小狗' },
      { upper: 'E', lower: 'e', tw: '依 / 依', word: 'Egg', icon: '🥚', meaning: '雞蛋' },
      { upper: 'F', lower: 'f', tw: '艾夫', word: 'Fish', icon: '🐟', meaning: '小魚' },
      { upper: 'G', lower: 'g', tw: '居 / 雞', word: 'Girl', icon: '👧', meaning: '女孩' },
      { upper: 'H', lower: 'h', tw: '挨居', word: 'Hat', icon: '🎩', meaning: '帽子' },
      { upper: 'I', lower: 'i', tw: '愛 / 愛', word: 'Ice', icon: '🧊', meaning: '冰塊' },
      { upper: 'J', lower: 'j', tw: '姐', word: 'Juice', icon: '🧃', meaning: '果汁' }
    ];

    let currentIndex = 0;
    let quizTargetIndex = 0;

    function init() {
      updateCard();
      initCanvas();
      setupQuiz();
      document.body.addEventListener('click', unlockAudio, { once: true });
    }

    function unlockAudio() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance('');
        window.speechSynthesis.speak(u);
      }
    }

    function updateCard() {
      const item = alphabetData[currentIndex];
      document.getElementById('letterDisplay').innerText = `${item.upper} ${item.lower}`;
      document.getElementById('phonetic').innerText = `近似發音: 「${item.tw}」`;
      document.getElementById('wordIcon').innerText = item.icon;
      document.getElementById('wordText').innerText = item.word;
      document.getElementById('wordMeaning').innerText = `(${item.meaning}) 🔊 點擊發音`;
      drawCanvasBg();
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        u.rate = 0.8;
        window.speechSynthesis.speak(u);
      }
    }

    function speakCurrentLetter() { speakText(alphabetData[currentIndex].upper); }
    function speakCurrentWord() { speakText(alphabetData[currentIndex].word); }

    function nextLetter() { currentIndex = (currentIndex + 1) % alphabetData.length; updateCard(); }
    function prevLetter() { currentIndex = (currentIndex - 1 + alphabetData.length) % alphabetData.length; updateCard(); }
    function jumpToIndex(idx) { currentIndex = idx; updateCard(); }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById(tabId).classList.add('active');
      if(tabId === 'writing') drawCanvasBg();
      if(tabId === 'quiz') setupQuiz();
    }

    // Canvas
    let canvas, ctx, isDrawing = false;
    function initCanvas() {
      canvas = document.getElementById('writeCanvas');
      ctx = canvas.getContext('2d');
      canvas.addEventListener('pointerdown', startDraw);
      canvas.addEventListener('pointermove', draw);
      canvas.addEventListener('pointerup', endDraw);
      drawCanvasBg();
    }

    function drawCanvasBg() {
      if(!ctx) return;
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.font = 'bold 180px sans-serif';
      ctx.fillStyle = '#f0f0f0';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(alphabetData[currentIndex].upper, canvas.width/2, canvas.height/2);
    }

    function startDraw(e) { isDrawing = true; ctx.beginPath(); draw(e); }
    function draw(e) {
      if (!isDrawing) return;
      const rect = canvas.getBoundingClientRect();
      ctx.lineWidth = 12; ctx.lineCap = 'round'; ctx.strokeStyle = '#2e86de';
      ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
      ctx.stroke();
    }
    function endDraw() { isDrawing = false; }
    function clearCanvas() { drawCanvasBg(); }

    // Quiz
    function setupQuiz() {
      quizTargetIndex = Math.floor(Math.random() * alphabetData.length);
      document.getElementById('quizFeedback').innerText = '';
      let options = [quizTargetIndex];
      while(options.length < 4) {
        let r = Math.floor(Math.random() * alphabetData.length);
        if(!options.includes(r)) options.push(r);
      }
      options.sort(() => Math.random() - 0.5);

      const container = document.getElementById('quizOptions');
      container.innerHTML = '';
      options.forEach(optIdx => {
        const btn = document.createElement('button');
        btn.className = 'quiz-btn';
        btn.innerText = alphabetData[optIdx].upper;
        btn.onclick = () => checkQuiz(optIdx);
        container.appendChild(btn);
      });
      playQuizSound();
    }

    function playQuizSound() { speakText(alphabetData[quizTargetIndex].upper); }

    function checkQuiz(selectedIdx) {
      const fb = document.getElementById('quizFeedback');
      if(selectedIdx === quizTargetIndex) {
        fb.innerText = '⭕ 太棒了！答對了！';
        fb.style.color = '#20bf6b';
        setTimeout(setupQuiz, 1500);
      } else {
        fb.innerText = '❌ 再試一次看看喔！';
        fb.style.color = '#eb3b5a';
      }
    }

    window.onload = init;
  </script>
</body>
</html>
